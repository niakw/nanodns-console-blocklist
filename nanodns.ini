# nanoDNS Console Blocklist — selective multi-console profile v3
# Updated: 2026-10-10 | Tested configuration: nanoDNS v0.4 on PS5 firmware 13.60
# Community-maintained best-effort DNS filtering; NOT a firewall.
# Installed path: /data/nanodns/nanodns.ini
# 124 DNS override rules; no exceptions. Does not block unrelated Internet by default.
# WARNING: brand-wide masks and the Akamai exact alias may cause collateral blocking.
# DNS traffic bypass, direct IP traffic and pre-payload traffic are OUT OF SCOPE.

[general]
log=/data/nanodns/nanodns.log
debug=0
quiet=0
bind=127.0.0.1
bind6=::1

[upstream]
server=1.1.1.1
server=9.9.9.9
timeout_ms=1500

[overrides]
